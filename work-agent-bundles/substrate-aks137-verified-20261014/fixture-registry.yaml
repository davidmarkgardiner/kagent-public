---
apiVersion: v1
kind: Namespace
metadata:
  name: substrate-proof
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-registry
  namespace: substrate-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture-registry
  template:
    metadata:
      labels:
        app: fixture-registry
    spec:
      containers:
      - name: registry
        image: registry@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fixture-registry
  namespace: substrate-proof
spec:
  selector:
    app: fixture-registry
  ports:
  - port: 5000
    targetPort: 5000
