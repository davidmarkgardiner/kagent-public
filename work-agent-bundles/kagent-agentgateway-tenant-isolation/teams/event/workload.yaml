apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-tools-code
  namespace: team-event
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOOL = os.environ["TOOL_NAME"]
    FIXTURE = json.loads(os.environ["FIXTURE"])
    requests = 0
    calls = 0
    forbidden_calls = 0

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print(json.dumps({"request": fmt % args}), flush=True)

        def reply(self, status, body, content_type="application/json"):
            payload = body if isinstance(body, bytes) else json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/healthz":
                return self.reply(200, {"status": "ok"})
            if self.path == "/metrics":
                metrics = (
                    f"tenant_mcp_requests_total {requests}\n"
                    f"tenant_mcp_tool_calls_total {calls}\n"
                    f"tenant_mcp_forbidden_tool_calls_total {forbidden_calls}\n"
                )
                return self.reply(200, metrics.encode(), "text/plain")
            return self.reply(404, {"error": "not found"})

        def do_POST(self):
            global requests, calls, forbidden_calls
            requests += 1
            if self.path != "/mcp":
                return self.reply(404, {"error": "not found"})
            try:
                request = json.loads(self.rfile.read(int(self.headers.get("Content-Length", "0"))))
                method = request.get("method")
                result = {}
                if method == "initialize":
                    result = {"protocolVersion": "2025-03-26", "capabilities": {"tools": {}}, "serverInfo": {"name": "tenant-fixture", "version": "1.0.0"}}
                elif method == "notifications/initialized":
                    self.send_response(202)
                    self.end_headers()
                    return
                elif method == "tools/list":
                    result = {"tools": [
                        {"name": TOOL, "description": "Read one bounded fixture", "inputSchema": {"type": "object", "properties": {"id": {"type": "string"}}, "required": ["id"], "additionalProperties": False}},
                        {"name": "delete_everything", "description": "Negative-test fixture that must be blocked by agentgateway", "inputSchema": {"type": "object", "additionalProperties": False}},
                    ]}
                elif method == "tools/call":
                    requested_tool = request.get("params", {}).get("name")
                    if requested_tool == "delete_everything":
                        forbidden_calls += 1
                        result = {"content": [{"type": "text", "text": "POLICY FAILURE: forbidden fixture reached the backend"}], "isError": False}
                    elif requested_tool != TOOL:
                        raise ValueError("unknown tool")
                    else:
                        calls += 1
                        result = {"content": [{"type": "text", "text": json.dumps(FIXTURE)}], "isError": False}
                else:
                    return self.reply(200, {"jsonrpc": "2.0", "id": request.get("id"), "error": {"code": -32601, "message": "method not found"}})
                return self.reply(200, {"jsonrpc": "2.0", "id": request.get("id"), "result": result})
            except Exception as exc:
                return self.reply(400, {"jsonrpc": "2.0", "id": None, "error": {"code": -32602, "message": str(exc)}})

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-tools
  namespace: team-event
  labels:
    tenant-isolation.agentgateway.dev/owner: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-tools
  template:
    metadata:
      labels:
        app: incident-tools
        tenant-isolation.agentgateway.dev/component: mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
          command: ["python", "/app/server.py"]
          env:
            - name: TOOL_NAME
              value: lookup_incident
            - name: FIXTURE
              value: '{"id":"INC-1001","severity":"SEV-2","service":"payments-api","runbook":"check consumer lag, then page the owning team"}'
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: incident-tools-code
---
apiVersion: v1
kind: Service
metadata:
  name: incident-tools
  namespace: team-event
  labels:
    tenant-isolation.agentgateway.dev/mcp-service: incident-tools
spec:
  selector:
    app: incident-tools
  ports:
    - name: mcp
      port: 8080
      targetPort: http
      appProtocol: agentgateway.dev/mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-adapter
  namespace: team-event
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-adapter-code
  namespace: team-event
data:
  adapter.py: |
    import json
    import os
    import urllib.request
    import uuid
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            raw = self.rfile.read(int(self.headers.get("Content-Length", "0")))
            event = json.loads(raw or b"{}")
            prompt = f"Look up incident {event.get('id', 'INC-1001')} and recommend the next step."
            payload = {"jsonrpc": "2.0", "id": str(uuid.uuid4()), "method": "message/send", "params": {"message": {"role": "user", "messageId": str(uuid.uuid4()), "parts": [{"kind": "text", "text": prompt}]}}}
            request = urllib.request.Request(os.environ["A2A_URL"], data=json.dumps(payload).encode(), headers={"Authorization": os.environ["AUTHORIZATION"], "Content-Type": "application/json", "Accept": "application/json, text/event-stream"})
            try:
                with urllib.request.urlopen(request, timeout=120) as response:
                    body = response.read()
                    self.send_response(response.status)
                    self.send_header("Content-Type", response.headers.get("Content-Type", "application/json"))
                    self.end_headers()
                    self.wfile.write(body)
            except Exception as exc:
                self.send_response(getattr(exc, "code", 502))
                self.end_headers()
                self.wfile.write(str(exc).encode())

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-adapter
  namespace: team-event
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-adapter
  template:
    metadata:
      labels:
        app: event-adapter
        tenant-isolation.agentgateway.dev/component: event-adapter
    spec:
      serviceAccountName: event-adapter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
          command: ["python", "/app/adapter.py"]
          env:
            - name: A2A_URL
              value: http://tenant-gateway.tenant-gateway-system.svc.cluster.local:8081/
            - name: AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: event-a2a-token
                  key: authorization
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: event-adapter-code
---
apiVersion: v1
kind: Service
metadata:
  name: event-adapter
  namespace: team-event
spec:
  selector:
    app: event-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: event-source
  namespace: team-event
  labels:
    tenant-isolation.agentgateway.dev/component: event-source
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
      command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
