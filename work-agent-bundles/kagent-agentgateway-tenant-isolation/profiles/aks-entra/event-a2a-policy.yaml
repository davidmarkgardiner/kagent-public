apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: event-a2a-auth
  namespace: tenant-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: event-a2a
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: https://login.microsoftonline.com/{{TEAM_EVENT_ENTRA_TENANT_ID}}/v2.0
          audiences:
            - api://{{TEAM_EVENT_A2A_CLIENT_ID}}
            - "{{TEAM_EVENT_A2A_CLIENT_ID}}"
          jwks:
            remote:
              backendRef:
                name: entra-jwks
                kind: AgentgatewayBackend
                group: agentgateway.dev
                port: 443
              jwksPath: /{{TEAM_EVENT_ENTRA_TENANT_ID}}/discovery/v2.0/keys
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - '"team-event.a2a.invoke" in jwt.roles'
