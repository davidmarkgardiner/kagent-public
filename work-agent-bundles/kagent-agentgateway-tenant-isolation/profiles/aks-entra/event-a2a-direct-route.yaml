# Tested with kagent v0.10.1 trusted-proxy mode on disposable AKS.
# The older controller /api/a2a/... route returned 401 without a trusted
# proxy identity. This route targets the Agent's namespaced Service directly.
# Keep the gateway JWT policy and namespace ingress restriction in place.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: event-a2a
  namespace: tenant-gateway-system
spec:
  parentRefs:
    - name: tenant-gateway
      sectionName: event-a2a
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: incident-adviser
          namespace: team-event
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-platform-a2a-route
  namespace: team-event
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: tenant-gateway-system
  to:
    - group: ""
      kind: Service
      name: incident-adviser
