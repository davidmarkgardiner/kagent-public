# Agent Substrate's atelet and gVisor worker path require privileged/hostPath
# access. These two namespaces are deliberately isolated exceptions for the
# disposable lab. They require a separate policy review before AKS promotion.
apiVersion: v1
kind: Namespace
metadata:
  name: ate-system
  labels:
    tenant-isolation.agentgateway.dev/discover: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
