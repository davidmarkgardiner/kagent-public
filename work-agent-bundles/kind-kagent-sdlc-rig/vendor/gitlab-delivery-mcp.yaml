apiVersion: v1
kind: ConfigMap
metadata:
  name: debt-factory-gitlab-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: debt-factory-gitlab-mcp
    app.kubernetes.io/part-of: debt-calculator-agentic-factory
data:
  server.py: |
    import json
    import os
    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    API = "https://gitlab.com/api/v4"
    PROJECT = urllib.parse.quote(os.environ["GITLAB_PROJECT_PATH"], safe="")
    TOKEN = os.environ["GITLAB_TOKEN"]
    TARGET_BRANCH = os.environ.get("GITLAB_TARGET_BRANCH", "main")
    # This POC is still project- and branch-scoped, but a builder may commit
    # the approved files incrementally. GitLab, not an A2A response, is the
    # source of truth for their contents.
    ALLOWED_FILES = {"README.md", "package.json", "index.html", "app.js", "tests/calculator.test.mjs", ".gitlab-ci.yml"}

    def api(method, path, payload=None, raw=False):
      headers = {"Authorization": "Bearer" + " " + TOKEN}
      data = None
      if payload is not None:
        headers["Content-Type"] = "application/json"
        data = json.dumps(payload).encode()
      request = urllib.request.Request(API + path, data=data, headers=headers, method=method)
      with urllib.request.urlopen(request, timeout=45) as response:
        response_text = response.read().decode()
        return response_text if raw else (json.loads(response_text) if response_text else {})

    def file_exists(path, ref):
      try:
        api("GET", f"/projects/{PROJECT}/repository/files/{urllib.parse.quote(path, safe='')}?ref={urllib.parse.quote(ref, safe='')}")
        return True
      except urllib.error.HTTPError as exc:
        if exc.code == 404:
          return False
        raise

    def validate_files(files, ref):
      if not isinstance(files, list) or not files:
        raise ValueError("files must be a non-empty array")
      paths = set()
      actions = []
      for item in files:
        # kagent's ADK bridge emits file_path; direct MCP callers use path.
        path = item.get("path", item.get("file_path", ""))
        content = item.get("content", "")
        if not isinstance(path, str) or not isinstance(content, str):
          raise ValueError("each file needs string path and content")
        if path.startswith("/") or ".." in path.split("/") or len(content) > 120000:
          raise ValueError("unsafe file path or oversized content")
        paths.add(path)
        action = "update" if file_exists(path, ref) else "create"
        actions.append({"action": action, "file_path": path, "content": content})
      if len(files) > len(ALLOWED_FILES) or not paths <= ALLOWED_FILES:
        raise ValueError("file path is outside the approved calculator profile")
      return actions

    def preflight(_args):
      project = api("GET", f"/projects/{PROJECT}")
      return {"project": project["path_with_namespace"], "default_branch": project["default_branch"], "target_branch": TARGET_BRANCH, "write_mode": "draft-mr-only"}

    def create_issue(args):
      title = args.get("title", "").strip()
      if not title or len(title) > 200: raise ValueError("title is required and must be <= 200 characters")
      issue = api("POST", f"/projects/{PROJECT}/issues", {"title": title, "description": args.get("description", "")})
      return {"iid": issue["iid"], "web_url": issue["web_url"]}

    def get_issue(args):
      iid = int(args["iid"])
      issue = api("GET", f"/projects/{PROJECT}/issues/{iid}")
      return {"iid": issue["iid"], "title": issue["title"], "description": issue.get("description", ""), "labels": issue.get("labels", []), "state": issue["state"], "web_url": issue["web_url"]}

    def list_issues(args):
      search = args.get("search", "").strip()
      if len(search) > 120: raise ValueError("search is too long")
      suffix = "?state=opened&per_page=50&order_by=updated_at&sort=desc"
      if search: suffix += "&search=" + urllib.parse.quote(search)
      issues = api("GET", f"/projects/{PROJECT}/issues{suffix}")
      return {"issues": [{"iid": item["iid"], "title": item["title"], "description": item.get("description", ""), "labels": item.get("labels", []), "web_url": item["web_url"]} for item in issues]}

    def update_issue(args):
      iid = int(args["iid"])
      payload = {}
      for key in ("title", "description", "state_event"):
        if key in args:
          payload[key] = args[key]
      if "labels" in args:
        labels = args["labels"]
        if not isinstance(labels, list) or not all(isinstance(label, str) and len(label) <= 80 for label in labels):
          raise ValueError("labels must be an array of short strings")
        payload["labels"] = ",".join(labels)
      if not payload:
        raise ValueError("at least one supported issue field is required")
      issue = api("PUT", f"/projects/{PROJECT}/issues/{iid}", payload)
      return {"iid": issue["iid"], "state": issue["state"], "labels": issue.get("labels", []), "web_url": issue["web_url"]}

    def create_branch(args):
      branch = args.get("branch", "")
      if not re.fullmatch(r"agentic/[a-z0-9-]{6,100}", branch): raise ValueError("branch must match agentic/<safe-name>")
      api("POST", f"/projects/{PROJECT}/repository/branches", {"branch": branch, "ref": TARGET_BRANCH})
      return {"branch": branch, "target_branch": TARGET_BRANCH}

    def commit_files(args):
      branch = args.get("branch", "")
      if not re.fullmatch(r"agentic/[a-z0-9-]{6,100}", branch): raise ValueError("branch must match agentic/<safe-name>")
      actions = validate_files(args.get("files"), branch)
      commit = api("POST", f"/projects/{PROJECT}/repository/commits", {"branch": branch, "commit_message": args.get("commit_message", "Agent delivery update"), "actions": actions})
      return {"branch": branch, "commit": commit.get("short_id"), "changed_paths": [action["file_path"] for action in actions]}

    def get_file(args):
      branch, path = args.get("branch", ""), args.get("path", "")
      if not re.fullmatch(r"agentic/[a-z0-9-]{6,100}", branch) or path not in ALLOWED_FILES: raise ValueError("branch or path rejected")
      item = api("GET", f"/projects/{PROJECT}/repository/files/{urllib.parse.quote(path, safe='')}?ref={urllib.parse.quote(branch, safe='')}")
      import base64
      return {"branch": branch, "path": path, "content": base64.b64decode(item["content"]).decode()}

    def create_draft_mr(args):
      branch = args.get("branch", "")
      if not re.fullmatch(r"agentic/[a-z0-9-]{6,100}", branch): raise ValueError("branch must match agentic/<safe-name>")
      title = args.get("title", "").strip()
      if not title: raise ValueError("title is required")
      mr = api("POST", f"/projects/{PROJECT}/merge_requests", {"source_branch": branch, "target_branch": TARGET_BRANCH, "title": "Draft: " + title, "description": args.get("description", ""), "draft": True, "remove_source_branch": True})
      return {"iid": mr["iid"], "web_url": mr["web_url"], "draft": mr.get("draft", True), "merge_performed": False}

    def get_merge_request(args):
      iid = int(args["iid"])
      mr = api("GET", f"/projects/{PROJECT}/merge_requests/{iid}")
      return {"iid": mr["iid"], "title": mr["title"], "state": mr["state"], "draft": mr.get("draft", True), "source_branch": mr["source_branch"], "sha": mr.get("sha"), "web_url": mr["web_url"]}

    def create_mr_note(args):
      iid = int(args["iid"])
      body = args.get("body", "").strip()
      if not body or len(body) > 8000:
        raise ValueError("MR note body is required and must be <= 8000 characters")
      note = api("POST", f"/projects/{PROJECT}/merge_requests/{iid}/notes", {"body": body})
      return {"iid": iid, "note_id": note["id"], "web_url": note.get("web_url", "")}

    def pipeline_status(args):
      iid = int(args["mr_iid"])
      mr = api("GET", f"/projects/{PROJECT}/merge_requests/{iid}")
      pipelines = api("GET", f"/projects/{PROJECT}/merge_requests/{iid}/pipelines")
      return {"mr_iid": iid, "mr_url": mr["web_url"], "state": mr["state"], "draft": mr.get("draft", True), "pipelines": [{"id": p["id"], "status": p["status"], "web_url": p["web_url"]} for p in pipelines[:3]]}

    def branch_pipeline_status(args):
      branch = args.get("branch", "")
      if not re.fullmatch(r"agentic/[a-z0-9-]{6,100}", branch): raise ValueError("branch must match agentic/<safe-name>")
      pipelines = api("GET", f"/projects/{PROJECT}/pipelines?ref={urllib.parse.quote(branch, safe='')}")
      return {"branch": branch, "pipelines": [{"id": p["id"], "status": p["status"], "web_url": p["web_url"]} for p in pipelines[:3]]}

    def pipeline_trace(args):
      pipeline_id = int(args["pipeline_id"])
      jobs = api("GET", f"/projects/{PROJECT}/pipelines/{pipeline_id}/jobs")
      if not jobs: raise ValueError("pipeline has no jobs")
      job = jobs[0]
      raw = api("GET", f"/projects/{PROJECT}/jobs/{job['id']}/trace", raw=True)
      return {"pipeline_id": pipeline_id, "job_id": job["id"], "job_name": job["name"], "job_status": job["status"], "trace": str(raw)[:24000]}

    TOOLS = [
      {"name": "gitlab_delivery_preflight", "description": "Verify the fixed sandbox project and draft-MR-only policy.", "inputSchema": {"type": "object", "properties": {}}},
      {"name": "gitlab_create_issue", "description": "Create one issue in the fixed sandbox project.", "inputSchema": {"type": "object", "required": ["title"], "properties": {"title": {"type": "string"}, "description": {"type": "string"}}}},
      {"name": "gitlab_get_issue", "description": "Read one fixed-project GitLab issue by IID.", "inputSchema": {"type": "object", "required": ["iid"], "properties": {"iid": {"type": "integer"}}}},
      {"name": "gitlab_list_issues", "description": "List open issues in the fixed project, optionally by bounded search.", "inputSchema": {"type": "object", "properties": {"search": {"type": "string"}}}},
      {"name": "gitlab_update_issue", "description": "Update title, description, labels, or state of one fixed-project issue. Never deletes.", "inputSchema": {"type": "object", "required": ["iid"], "properties": {"iid": {"type": "integer"}, "title": {"type": "string"}, "description": {"type": "string"}, "labels": {"type": "array"}, "state_event": {"type": "string"}}}},
      {"name": "gitlab_create_branch", "description": "Create one allow-listed agentic branch from main.", "inputSchema": {"type": "object", "required": ["branch"], "properties": {"branch": {"type": "string"}}}},
      {"name": "gitlab_commit_files", "description": "Commit the approved calculator file set to an existing agentic branch.", "inputSchema": {"type": "object", "required": ["branch", "files"], "properties": {"branch": {"type": "string"}, "files": {"type": "array"}, "commit_message": {"type": "string"}}}},
      {"name": "gitlab_get_file", "description": "Read one approved calculator file from an agentic branch.", "inputSchema": {"type": "object", "required": ["branch", "path"], "properties": {"branch": {"type": "string"}, "path": {"type": "string"}}}},
      {"name": "gitlab_create_draft_mr", "description": "Create a draft merge request from an existing agentic branch. Never merges.", "inputSchema": {"type": "object", "required": ["branch", "title"], "properties": {"branch": {"type": "string"}, "title": {"type": "string"}, "description": {"type": "string"}}}},
      {"name": "gitlab_get_merge_request", "description": "Read one fixed-project merge request by IID.", "inputSchema": {"type": "object", "required": ["iid"], "properties": {"iid": {"type": "integer"}}}},
      {"name": "gitlab_create_mr_note", "description": "Add a bounded review note to one fixed-project draft merge request.", "inputSchema": {"type": "object", "required": ["iid", "body"], "properties": {"iid": {"type": "integer"}, "body": {"type": "string"}}}},
      {"name": "gitlab_branch_pipeline_status", "description": "Read GitLab CI pipeline status for an existing agentic branch.", "inputSchema": {"type": "object", "required": ["branch"], "properties": {"branch": {"type": "string"}}}},
      {"name": "gitlab_pipeline_trace", "description": "Read the first GitLab CI job trace for a pipeline.", "inputSchema": {"type": "object", "required": ["pipeline_id"], "properties": {"pipeline_id": {"type": "integer"}}}},
      {"name": "gitlab_pipeline_status", "description": "Read pipeline state for a merge request in the fixed sandbox project.", "inputSchema": {"type": "object", "properties": {"mr_iid": {"type": "integer"}}, "required": ["mr_iid"]}},
    ]

    class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
        self.send_response(200); self.send_header("content-type", "text/event-stream"); self.end_headers(); self.wfile.write(b": debt-factory-gitlab-mcp\n\n")
      def do_DELETE(self):
        # Streamable-HTTP clients close their ephemeral MCP session this way.
        self.send_response(204); self.end_headers()
      def do_POST(self):
        request = json.loads(self.rfile.read(int(self.headers.get("content-length", "0"))).decode() or "{}")
        request_id, method = request.get("id"), request.get("method")
        try:
          if method == "initialize": result = {"protocolVersion": "2025-06-18", "capabilities": {"tools": {}}, "serverInfo": {"name": "debt-factory-gitlab-mcp", "version": "0.1.0"}}
          elif method == "notifications/initialized": self.send_response(202); self.end_headers(); return
          elif method == "tools/list": result = {"tools": TOOLS}
          elif method == "tools/call":
            params = request.get("params") or {}; name = params.get("name"); args = params.get("arguments") or {}
            handlers = {"gitlab_delivery_preflight": preflight, "gitlab_create_issue": create_issue, "gitlab_get_issue": get_issue, "gitlab_list_issues": list_issues, "gitlab_update_issue": update_issue, "gitlab_create_branch": create_branch, "gitlab_commit_files": commit_files, "gitlab_get_file": get_file, "gitlab_create_draft_mr": create_draft_mr, "gitlab_get_merge_request": get_merge_request, "gitlab_create_mr_note": create_mr_note, "gitlab_branch_pipeline_status": branch_pipeline_status, "gitlab_pipeline_trace": pipeline_trace, "gitlab_pipeline_status": pipeline_status}
            if name not in handlers: raise ValueError("unknown tool")
            result = {"content": [{"type": "text", "text": json.dumps(handlers[name](args), indent=2)}]}
          else: raise ValueError("unsupported method")
          response = {"jsonrpc": "2.0", "id": request_id, "result": result}
        except (ValueError, KeyError, urllib.error.HTTPError, urllib.error.URLError) as exc:
          response = {"jsonrpc": "2.0", "id": request_id, "error": {"code": -32000, "message": str(exc)}}
        body = json.dumps(response).encode(); self.send_response(200); self.send_header("content-type", "application/json"); self.send_header("content-length", str(len(body))); self.end_headers(); self.wfile.write(body)
      def log_message(self, fmt, *args): print(fmt % args, flush=True)
    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debt-factory-gitlab-mcp
  namespace: kagent
  labels:
    app.kubernetes.io/name: debt-factory-gitlab-mcp
    app.kubernetes.io/part-of: debt-calculator-agentic-factory
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: debt-factory-gitlab-mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: debt-factory-gitlab-mcp, app.kubernetes.io/part-of: debt-calculator-agentic-factory}
    spec:
      containers:
        - name: mcp
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          ports: [{containerPort: 8080}]
          env:
            - name: GITLAB_PROJECT_PATH
              value: "{{GITLAB_PROJECT_PATH}}"
            - name: GITLAB_TARGET_BRANCH
              value: main
            - name: GITLAB_TOKEN
              valueFrom: {secretKeyRef: {name: debt-factory-gitlab-token, key: token}}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
      volumes: [{name: app, configMap: {name: debt-factory-gitlab-mcp}}]
---
apiVersion: v1
kind: Service
metadata:
  name: debt-factory-gitlab-mcp
  namespace: kagent
  labels: {app.kubernetes.io/name: debt-factory-gitlab-mcp, app.kubernetes.io/part-of: debt-calculator-agentic-factory}
spec:
  selector: {app.kubernetes.io/name: debt-factory-gitlab-mcp}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: debt-factory-gitlab-mcp
  namespace: kagent
  labels: {app.kubernetes.io/part-of: debt-calculator-agentic-factory}
spec:
  description: "Fixed-project GitLab delivery tools through Agent Gateway: preflight, issue/branch/commit/draft-MR, and pipeline status. No merge or delete tool exists."
  protocol: STREAMABLE_HTTP
  timeout: 121s
  sseReadTimeout: 10m0s
  url: http://ai-gateway.agentgateway-system.svc.cluster.local/mcp/debt-factory-gitlab
