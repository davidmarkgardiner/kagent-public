apiVersion: batch/v1
kind: CronJob
metadata:
  name: sdlc-board-poller
  namespace: sdlc-rig
  labels: {app.kubernetes.io/part-of: sdlc-rig}
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  suspend: false
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 210
      backoffLimit: 0
      template:
        metadata:
          labels: {app.kubernetes.io/part-of: sdlc-rig, sdlc-rig/role: board-poller}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector: {sdlc-rig.kagent.dev/worker: "true"}
          tolerations:
            - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: poller
              image: python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command: [python3, /app/board_poller.py]
              resources:
                requests: {cpu: 25m, memory: 48Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              env:
                - name: GITLAB_TOKEN
                  valueFrom:
                    secretKeyRef: {name: gitlab-project-token, key: token}
                - name: GITLAB_PROJECT_PATH
                  valueFrom:
                    configMapKeyRef: {name: sdlc-rig-settings, key: project-path}
                - name: PM_A2A_URL
                  value: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/sdlc-rig/sdlc-pm/
                - name: A2A_TIMEOUT
                  value: "150"
              volumeMounts:
                - {name: poller, mountPath: /app, readOnly: true}
          volumes:
            - name: poller
              configMap: {name: sdlc-board-poller-code, defaultMode: 0444}
