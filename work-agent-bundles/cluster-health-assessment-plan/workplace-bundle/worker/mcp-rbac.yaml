apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-health-investigator-namespace-read
  labels:
    app.kubernetes.io/part-of: cluster-health-assessment
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-health-investigator-node-read
  labels:
    app.kubernetes.io/part-of: cluster-health-assessment
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-health-investigator-node-read
  labels:
    app.kubernetes.io/part-of: cluster-health-assessment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-health-investigator-node-read
subjects:
  - kind: ServiceAccount
    name: "{{AKS_MCP_SERVICE_ACCOUNT_NAME}}"
    namespace: "{{AKS_MCP_SERVICE_ACCOUNT_NAMESPACE}}"
