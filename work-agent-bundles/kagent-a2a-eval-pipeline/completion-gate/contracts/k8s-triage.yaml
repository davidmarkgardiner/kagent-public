# Completion contract matching the red-cluster A2A evaluation gate
# (homelab-verified-triage-replication/a2a-evaluation-gate, live 2026-07-31).
# Migration note: the July evaluator prompt does not echo the contract; deploy
# manifests/completion-evaluator-agent.yaml (or add the echo) before enforcing.
schemaVersion: completion-contract/v1alpha1
name: k8s-readonly-triage
version: "1"
agent: evaluated-k8s-readonly-triage-agent
evaluator:
  agent: completion-evaluator-agent
  namespace: kagent
  maxAttempts: 3
allowedTools:
  - k8s_check_service_connectivity
  - k8s_get_events
  - k8s_get_available_api_resources
  - k8s_get_cluster_configuration
  - k8s_describe_resource
  - k8s_get_resource_yaml
  - k8s_get_resources
  - k8s_get_pod_logs
allowedAgents:
  - kagent/aks-network-flow-triage   # optional network deep-dive delegate
requiredTools:
  # The July proof's only K8s call was k8s_get_cluster_configuration; keep it valid.
  - anyOf: [k8s_get_resources, k8s_describe_resource, k8s_get_events, k8s_get_pod_logs, k8s_get_cluster_configuration]
output:
  envelope: triage
  sections:
    - TL;DR
    - Overall health
    - Evidence used
    - Likely cause
    - Risks
    - Recommended human-approved next steps
    - Confidence
delivery:
  owner: downstream         # Argo writes the GitLab work item; evaluation_failed_ticket -> triage::evaluation-failed
  requiredLabels: []
