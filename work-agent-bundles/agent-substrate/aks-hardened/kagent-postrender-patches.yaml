# Kustomize patches for the kagent 0.10.1 release. The chart already runs the
# controller and UI with a read-only root filesystem, non-root users, drop ALL,
# RuntimeDefault seccomp and limits. Only the bundled PostgreSQL lacks a
# read-only root filesystem, and the chart cannot mount the writable socket
# directory it needs, so this patch adds both. Not needed when
# database.postgres.bundled.enabled is false (external PostgreSQL).
# Assumes release name `kagent`.
- target:
    kind: Deployment
    name: kagent-postgresql
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kagent-postgresql
    spec:
      template:
        spec:
          containers:
          - name: postgresql
            securityContext:
              readOnlyRootFilesystem: true
            volumeMounts:
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: run
            emptyDir:
              sizeLimit: 16Mi
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
