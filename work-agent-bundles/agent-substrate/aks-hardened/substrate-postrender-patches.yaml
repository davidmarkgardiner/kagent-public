# RustFS already runs as 10001. It keeps data on its PVC at /data and writes
# logs to /logs at startup, which fails on a read-only root without a volume.
- target:
    kind: Deployment
    name: rustfs
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: rustfs
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: rustfs
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {cpu: "1", memory: 1Gi}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /logs
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 256Mi
          - name: logs
            emptyDir:
              sizeLimit: 512Mi

# Valkey: the chart runs valkey-server directly (bypassing the image's
# gosu entrypoint), so run it as the image's valkey user (999). nodes.conf and
# the AOF live on the /data PVC.
- target:
    kind: StatefulSet
    name: valkey-cluster
  patch: |
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: valkey-cluster
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: valkey
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi

- target:
    kind: Job
    name: valkey-cluster-init
  patch: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: valkey-cluster-init
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: init
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 200m, memory: 128Mi}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 16Mi

# The aws-cli Job only creates the RustFS bucket. HOME points at the
# writable /tmp so the CLI never touches the read-only root filesystem.
- target:
    kind: Job
    name: rustfs-bucket-init
  patch: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: rustfs-bucket-init
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: create-bucket
            env:
            - name: HOME
              value: /tmp
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi

# atelet must stay privileged: it drives gVisor checkpoint/restore and
# containerd on the node. It is one of the two workloads that need a policy
# exception. The patch still gives it a read-only root filesystem and limits,
# and pins it to the Substrate node pool (the chart has no values for
# placement). It selects the pool by the label AKS puts on every node,
# kubernetes.azure.com/agentpool, and tolerates any NoSchedule taint on that
# pool, so no custom label or taint is needed. Change `substrate` if the pool
# has another name; it must match workerpool.yaml.
- target:
    kind: DaemonSet
    name: atelet
  patch: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: atelet
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.azure.com/agentpool: substrate
          tolerations:
          - operator: Exists
            effect: NoSchedule
          containers:
          - name: atelet
            securityContext:
              privileged: true
              readOnlyRootFilesystem: true
            resources:
              requests: {cpu: 250m, memory: 256Mi}
              limits: {cpu: "2", memory: 2Gi}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
