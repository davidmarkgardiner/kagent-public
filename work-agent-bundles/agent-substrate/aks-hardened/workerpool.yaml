# gVisor WorkerPool in ate-system, next to atelet, so all privileged pods are in
# one namespace. atecontroller generates the worker Deployment from this object
# and sets its securityContext itself (privileged, root, hostPath); that cannot be
# changed, so these pods need the same policy exception as atelet. Resources and
# placement can be set, and are required by the cluster safeguards.
# The nodeSelector uses the AKS built-in pool label and must match the atelet
# patch in substrate-postrender-patches.yaml (change `substrate` if the pool has
# another name). The toleration accepts any NoSchedule taint on that pool.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: kagent-default
  namespace: ate-system
  labels:
    kagent.dev/worker-pool: kagent-default
spec:
  replicas: 3
  ateomImage: "{{INTERNAL_REGISTRY}}/kagent-dev/substrate/ateom-gvisor@sha256:4aa5631a7e42e247660c12bef21d50c0a6a717fb717752748cc56a1b849a1fbc"
  sandboxClass: gvisor
  template:
    nodeSelector:
      kubernetes.azure.com/agentpool: substrate
    tolerations:
      - operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
