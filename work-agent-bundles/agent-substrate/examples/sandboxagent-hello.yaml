apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: hello-substrate
  namespace: kagent
spec:
  type: Declarative
  # This fixture targets the canary-tested 0.10.1 CRD, which selects the
  # Substrate path from this block. Do not add spec.platform unless the target
  # CRD advertises that field.
  description: Tiny declarative agent running inside a substrate gVisor actor
  declarative:
    # The 0.10.1 / 0.0.9 canary and retained full-A2A proof cover Go ADK.
    runtime: go
    modelConfig: default-model-config
    systemMessage: |
      You are a friendly assistant living inside an Agent Substrate sandbox.
      When asked who you are, say "I am hello-substrate, a Go ADK declarative
      agent running inside a gVisor actor."
  substrate:
    # Which substrate worker pool hosts this agent's actors.
    workerPoolRef:
      name: kagent-default
