apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-reader
  namespace: kubernetes-mcp-poc
  labels:
    app.kubernetes.io/name: kubernetes-mcp-reader
    app.kubernetes.io/part-of: homelab-cross-cluster-poc
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-poc-reader
  labels:
    app.kubernetes.io/name: kubernetes-mcp-reader
    app.kubernetes.io/part-of: homelab-cross-cluster-poc
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-poc-reader
  labels:
    app.kubernetes.io/name: kubernetes-mcp-reader
    app.kubernetes.io/part-of: homelab-cross-cluster-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-poc-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-reader
    namespace: kubernetes-mcp-poc
