site_name: Incident JSON to Agents
site_description: AKS Istio, Entra roles and agentgateway A2A proof of concept
docs_dir: docs
site_dir: site
use_directory_urls: false
theme:
  name: mkdocs
  highlightjs: false
  color_mode: light
  user_color_mode_toggle: true
nav:
  - Overview: README.md
  - AKS setup and Entra roles: aks/README.md
  - Lab proof: poc/README.md
  - Validation: aks/VALIDATION.md
  - Downloads: downloads.md
  - Work-agent skill: skill.md
  - Build and maintain: site-guide.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
validation:
  nav:
    not_found: warn
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
