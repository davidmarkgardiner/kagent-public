# Default values for aks-mcp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/azure/aks-mcp
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  # Keep empty to pin to Chart.appVersion. Do not use latest: v0.0.20 changed
  # AKS-MCP to stdio-only and cannot serve this chart's HTTP Service.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Fixed replica count used only when horizontal autoscaling is disabled.
replicaCount: 1
revisionHistoryLimit: 3
minReadySeconds: 5

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Application configuration
app:
  # Transport mechanism: stdio, sse, streamable-http
  transport: "streamable-http"
  # Port to listen on
  port: 8000
  # Access level: readonly, readwrite, admin
  accessLevel: "readonly"
  # Command execution timeout in seconds
  timeout: 600
  # Log level: debug, info, warn, error
  logLevel: "info"
  # Enable cache for better performance
  cache: true
  # Enable token-only authentication mode for supported tools
  # When enabled, tools like kubectl use Azure AKS RunCommand API with user tokens
  # Requires transport to be sse or streamable-http (not compatible with stdio)
  tokenAuthOnly: false

# Azure authentication configuration
azure:
  # Use existing secret for Azure credentials (for Service Principal auth)
  existingSecret: ""
  # Azure tenant ID (can be set via secret for Service Principal)
  tenantId: ""
  # Azure client ID (can be set via secret for Service Principal)
  clientId: ""
  # Azure client secret (only for Service Principal auth, ignored when Workload Identity is enabled)
  clientSecret: ""
  # Azure subscription ID to set the current default active subscription
  subscriptionId: ""

# Azure Workload Identity configuration
workloadIdentity:
  # Enable Azure Workload Identity for passwordless authentication
  # When enabled, requires azure.tenantId and azure.clientId to be set
  # Federated credential must be created in Azure before installation
  enabled: false

# OAuth configuration
oauth:
  # Enable OAuth authentication
  enabled: false
  # Azure AD tenant ID for OAuth (falls back to azure.tenantId)
  tenantId: ""
  # Azure AD client ID for OAuth (falls back to azure.clientId)
  clientId: ""
  # Custom OAuth scopes (e.g., ["api://your-app-id/.default"])
  # If empty, defaults to https://management.azure.com/.default
  # Use custom App ID URI scope to enforce "Assignment Required" in Azure AD
  scopes: []
  # Custom redirect URIs (auto-generated if empty)
  redirectURIs: []
  # Custom CORS origins (auto-generated if empty)
  corsOrigins: []

# Application configuration
config:
  # Enabled components (empty means all components enabled)
  # Available components: az_cli, monitor, fleet, network, compute, detectors, advisor, inspektorgadget, kubectl, helm, cilium, hubble
  enabledComponents: []
  # Allowed Kubernetes namespaces (empty means all)
  allowNamespaces: []
  # Cache timeout
  cacheTimeout: "60s"

# Kubeconfig configuration
kubeconfig:
  enabled: false
  secretName: "kubeconfig"

# Telemetry configuration
telemetry:
  # OTLP endpoint for OpenTelemetry traces
  otlpEndpoint: ""

# Ingress configuration
ingress:
  # Enable ingress for the application
  enabled: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC settings
rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Read-only AKS-MCP should not read Kubernetes Secrets by default. Enable only
  # for a narrowly scoped remediation specialist with explicit approval.
  includeSecrets: false

# Pod security settings
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  # Streamable HTTP in AKS-MCP v0.0.16 uses stateless session-ID validation for
  # ordinary POST requests. Keep None unless a tested future version requires
  # client affinity; ClientIP can concentrate all kagent traffic on one pod.
  sessionAffinity: None

networkPolicy:
  enabled: false
  ingress: []

# Select exactly one horizontal scaling controller. KEDA creates and owns an
# HPA, so mode=keda and mode=hpa are deliberately mutually exclusive.
autoscaling:
  # disabled, keda, or hpa
  mode: disabled
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    # Slow scale-down protects long-running MCP requests and avoids flapping.
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  keda:
    pollingInterval: 15
    cooldownPeriod: 300
    fallback:
      enabled: true
      failureThreshold: 3
      replicas: 2
    prometheus:
      # A Prometheus HTTP query endpoint. For Azure Managed Prometheus this is
      # the workspace query endpoint, not the ingestion endpoint.
      serverAddress: ""
      # Must return one scalar/vector element. Prefer active requests; use RPS
      # only when an in-flight request gauge is unavailable.
      query: ""
      # Desired active requests or requests/second per replica.
      threshold: "10"
      activationThreshold: "1"
      # Empty results should fail the scaler and activate fallback capacity.
      ignoreNullValues: false
      unsafeSsl: false
      timeout: "3000"
      # Set only for an existing bearer/basic/TLS TriggerAuthentication.
      authModes: ""
    authentication:
      # When true, the chart creates an Azure Workload Identity
      # TriggerAuthentication for Azure Managed Prometheus.
      create: false
      # When create=false, set name to reference an existing authentication.
      name: ""
      kind: TriggerAuthentication
      azureWorkloadIdentity:
        # Use a dedicated scaler UAMI with Monitoring Data Reader on the Azure
        # Monitor workspace; do not grant it AKS-MCP's cluster permissions.
        identityId: ""
  hpa:
    # CPU is a fallback only. Request/concurrency metrics are the preferred
    # signal because remote Azure/kubectl calls can be I/O-bound.
    targetCPUUtilizationPercentage: 70

# VPA is intentionally recommendation-only. It may inform future requests but
# must not mutate CPU/memory while horizontal scaling is being evaluated.
vpa:
  enabled: false
  updateMode: "Off"
  controlledResources:
    - cpu
    - memory
  controlledValues: RequestsOnly
  minAllowed:
    cpu: 50m
    memory: 64Mi
  maxAllowed:
    cpu: "1"
    memory: 1Gi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# The upstream container includes /bin/sh. A preStop delay gives Services time
# to remove a terminating pod before SIGTERM ends any in-flight connection.
terminationGracePeriodSeconds: 45
lifecycle: {}

# Extension points for advanced usage
extraVolumes: []
extraVolumeMounts: []
extraEnv: []

# Optional Kubernetes scheduling
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
