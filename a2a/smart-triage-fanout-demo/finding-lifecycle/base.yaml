apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-triage-finding-lifecycle
  namespace: argo
  labels:
    app.kubernetes.io/name: smart-triage-finding-lifecycle
    app.kubernetes.io/part-of: smart-triage-fanout
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-triage-finding-lifecycle
  namespace: argo
  labels:
    app.kubernetes.io/name: smart-triage-finding-lifecycle
    app.kubernetes.io/part-of: smart-triage-fanout
    platform.com/type: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-triage-finding-lifecycle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smart-triage-finding-lifecycle
        app.kubernetes.io/part-of: smart-triage-fanout
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lifecycle
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: [python, /app/lifecycle.py]
          env:
            - name: DATABASE_PATH
              value: /data/findings.db
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: smart-triage-finding-lifecycle-code
        - name: data
          persistentVolumeClaim:
            claimName: smart-triage-finding-lifecycle
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smart-triage-finding-lifecycle
  namespace: argo
  labels:
    app.kubernetes.io/name: smart-triage-finding-lifecycle
    app.kubernetes.io/part-of: smart-triage-fanout
spec:
  selector:
    app.kubernetes.io/name: smart-triage-finding-lifecycle
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-triage-finding-lifecycle
  namespace: argo
  labels:
    app.kubernetes.io/name: smart-triage-finding-lifecycle
    app.kubernetes.io/part-of: smart-triage-fanout
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-triage-finding-lifecycle
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo
      ports:
        - protocol: TCP
          port: 8080
  egress: []
