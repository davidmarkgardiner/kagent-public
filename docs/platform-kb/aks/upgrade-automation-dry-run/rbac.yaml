apiVersion: v1
kind: ServiceAccount
metadata:
  name: aks-upgrade-dry-run
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aks-upgrade-dry-run-executor
  namespace: argo
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aks-upgrade-dry-run-executor
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aks-upgrade-dry-run-executor
subjects:
  - kind: ServiceAccount
    name: aks-upgrade-dry-run
    namespace: argo
