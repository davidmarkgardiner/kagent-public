# STEP 11 - Bind the agent token holder to a blueprint
# SAY: A dedicated Kubernetes identity federates directly to our Entra Agent ID blueprint.
# POINT TO: ServiceAccount name/namespace and blueprint client ID annotation.
# BOUNDARY: Entra blueprint, child identity, FIC and role assignments are external setup.
#   The runtime performs child-token exchange.

# Blueprint and child identity are provisioned separately in Entra / Microsoft Graph.
# This ServiceAccount belongs to the selected token-acquisition component.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent-token-holder
  namespace: team-sre
  annotations:
    azure.workload.identity/client-id: "{{BLUEPRINT_CLIENT_ID}}"
    azure.workload.identity/tenant-id: "{{ENTRA_TENANT_ID}}"
# Its Pod template must use serviceAccountName: sre-agent-token-holder and
# metadata.labels.azure.workload.identity/use: "true".
# The runtime must implement the Agent ID blueprint -> child token exchange,
# request the MCP API audience and refresh tokens before expiry.
# Workload Identity injection alone does not perform that exchange.
