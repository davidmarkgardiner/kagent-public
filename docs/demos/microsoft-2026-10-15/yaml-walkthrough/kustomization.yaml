# kustomization.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- 01-agent.yaml  # This base Agent is the object we assemble locally for the presentation.
patches:
- path: 02-agent-skills.patch.yaml  # First merge the reviewed skill configuration into that Agent.
- path: 03-agent-tools.patch.yaml  # Then merge the selected MCP tool configuration into the same Agent.
