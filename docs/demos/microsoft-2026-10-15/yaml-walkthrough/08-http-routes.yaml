# STEP 08 - Add gateway routes
# SAY: We bind a gateway listener to the named MCP backend; the second route selects the
#   SRE chatbot.
# POINT TO: parentRefs, listener sectionName, backendRefs and the A2A path rewrite.
# BOUNDARY: Existing HTTPS Gateway/listeners and controller service are prerequisites.
#   Routes do not authenticate callers.

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp
  namespace: platform-gateway
spec:
  parentRefs:
  - name: agent-gateway
    sectionName: mcp
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: kubernetes-mcp
      namespace: team-tools
---
# Named invocation route; discovery/streaming paths need their own tested contract.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sre-chat-a2a
  namespace: platform-gateway
spec:
  parentRefs:
  - name: agent-gateway
    sectionName: a2a
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /api/a2a/team-sre/sre-chat/
    backendRefs:
    - name: kagent-controller
      namespace: kagent
      port: 8083
