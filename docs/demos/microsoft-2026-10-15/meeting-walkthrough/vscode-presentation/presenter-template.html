<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Microsoft meeting · visual walkthrough</title>
<style>
:root{color-scheme:light;--paper:#F4F3EE;--ink:#1C1C1C;--muted:#5A5D5C;--red:#E60000;--line:#CCCABC}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}button,select,input{font:inherit}button,select{background:#fff;color:var(--ink);border:1px solid #5A5D5C;border-radius:4px;padding:7px 11px;cursor:pointer}button:hover{background:#CCCABC}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid var(--red);outline-offset:3px}a{color:var(--red);text-underline-offset:3px}::selection{background:#CCCABC;color:var(--ink)}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}header strong{font-size:16px}header nav{display:flex;flex-wrap:wrap;gap:8px}.slide{display:none;max-width:1400px;margin:auto}.slide.active{display:block}.slide>svg{display:block;width:100%;height:auto;min-width:650px}.diagram-wrap{overflow-x:auto}.file-links{display:flex;flex-wrap:wrap;gap:8px;padding:8px 28px 18px}.file-links button{font-size:12px}.file-links button[data-chrome]{font-size:14px;background:var(--ink);color:#fff}.notes{margin:0 28px 24px;padding:12px 0;border-top:1px solid var(--line)}summary{cursor:pointer}p{max-width:85ch}.notes button{padding:4px 0;border:0;background:none;text-align:left;color:var(--red);font-size:13px;overflow-wrap:anywhere}.notes li{margin:7px 0}.controls{position:sticky;bottom:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-top:1px solid var(--line)}.controls div{display:flex;align-items:center;gap:10px}.controls select{max-width:52vw;font-size:13px}.phase{font-size:13px;color:var(--muted)}.prompt{margin:0 28px 16px;padding-top:12px;border-top:1px solid var(--line)}.prompt p{font-size:14px}.prompt button{font-size:13px}#status{margin:0;padding:0 22px;font-size:13px;color:var(--red)}#fallback{margin:10px 22px;padding:14px;background:#fff;border:1px solid var(--line)}#fallback pre{max-height:400px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.6 Menlo,Consolas,monospace}.browser-note{display:none;margin:0;padding:8px 22px;border-bottom:1px solid var(--line);font-size:13px}.standalone .browser-note{display:block}svg a{cursor:pointer}svg a:focus rect{stroke-width:4}
@media(max-width:700px){header{padding:10px 14px}header nav{gap:5px}header button{font-size:12px}.controls{padding:10px 14px}.phase{display:none}.controls select{max-width:48vw}.file-links{padding:10px 14px}.controls button{font-size:13px;padding:6px 9px}.notes,.prompt{margin-left:14px;margin-right:14px}}
.slide>svg{max-height:calc(100vh - 250px)}
@media print{header,.controls,#status,#fallback,.browser-note,.file-links,.notes,.prompt{display:none!important}.slide{display:block!important;break-after:page;page-break-after:always}.slide>svg{width:100%;min-width:0;height:180mm}@page{size:A4 landscape;margin:5mm}}
</style></head><body>
<header><strong>Agents in our workflows</strong><nav><button id="markdown">Markdown + code</button><button id="visuals">Visual presentation</button><button id="settings">Live app URLs</button></nav></header>
<p class="browser-note">Browser fallback. The VS Code launcher keeps the real YAML on the left and this visual on the right. File buttons below show a local source preview here.</p>
<div id="status" role="status" aria-live="polite"></div><div id="fallback" hidden><button id="close-source">Close source preview</button><pre></pre></div>
<main class="diagram-wrap"><!--SLIDES--></main>
<footer class="controls"><div><button id="prev" aria-label="Previous slide">Previous</button><button id="next" aria-label="Next slide">Next</button><span id="phase" class="phase"></span></div><select id="jump" aria-label="Meeting stop"><!--OPTIONS--></select></footer>
<script>
const prompts=/*PROMPTS*/;
const vscode=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():null;
const slides=[...document.querySelectorAll('.slide')], jump=document.querySelector('#jump');
const phases=/*PHASES*/;
const status=document.querySelector('#status');let current=0;
if(!vscode)document.body.classList.add('standalone');
function show(i){current=Math.max(0,Math.min(i,slides.length-1));slides.forEach((s,j)=>s.classList.toggle('active',j===current));jump.value=String(current);document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelector('#phase').textContent=phases[current];if(vscode)vscode.setState({slide:current});else location.hash=slides[current].id;window.scrollTo(0,0)}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);jump.onchange=()=>show(Number(jump.value));
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button,summary'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(current-1)}if(e.key==='Home'){e.preventDefault();show(0)}if(e.key==='End'){e.preventDefault();show(slides.length-1)}});
document.addEventListener('click',async e=>{const file=e.target.closest('[data-file]'),source=e.target.closest('[data-source]'),chrome=e.target.closest('[data-chrome]'),copy=e.target.closest('[data-copy]');if(file||source){e.preventDefault();const message=file?{type:'file',file:file.dataset.file}:{type:'source',path:source.dataset.source};if(vscode)vscode.postMessage(message);else if(file){try{const r=await fetch('../../yaml-walkthrough/'+file.dataset.file);if(!r.ok)throw Error('Source not available');document.querySelector('#fallback pre').textContent=await r.text();document.querySelector('#fallback').hidden=false;window.scrollTo(0,0)}catch{status.textContent='Use the VS Code launcher to open the YAML. This browser blocks local-file reads.'}}else status.textContent='Open this repository source from the VS Code presenter.'}if(chrome){if(vscode)vscode.postMessage({type:'chrome',app:chrome.dataset.chrome});else status.textContent='Configure live app URLs inside the VS Code presenter.'}if(copy){try{if(vscode){vscode.postMessage({type:'copy',text:prompts[Number(copy.dataset.copy)]})}else{await navigator.clipboard.writeText(prompts[Number(copy.dataset.copy)]);status.textContent='Prompt copied. Fill the approved scope before using it.'}}catch{status.textContent='Clipboard unavailable. Select and copy the visible prompt.'}}});
document.querySelector('#markdown').onclick=()=>vscode?vscode.postMessage({type:'markdown'}):window.open('PRESENTATION.md','_blank');
document.querySelector('#visuals').onclick=()=>show(slides.findIndex(s=>s.id==='triage'));
document.querySelector('#settings').onclick=()=>vscode?vscode.postMessage({type:'settings'}):status.textContent='Set the two live app URLs in the VS Code presenter. No URLs have been supplied.';
document.querySelector('#close-source').onclick=()=>document.querySelector('#fallback').hidden=true;
window.addEventListener('message',e=>{if(e.data.type==='status')status.textContent=e.data.text});
const remembered=vscode?.getState()?.slide;const fragment=slides.findIndex(s=>s.id===location.hash.slice(1));show(Number.isInteger(remembered)?remembered:Math.max(0,fragment));
</script></body></html>
