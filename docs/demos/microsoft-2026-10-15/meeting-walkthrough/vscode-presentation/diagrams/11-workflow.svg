<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">Build agents into the delivery workflow</title><desc id="workflow-desc">The output is a reviewable change with checks and verification.</desc><rect width="1200" height="680" fill="#F4F3EE"/><defs><marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E60000"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}a:hover rect{stroke-width:3}a:focus{outline:3px solid #9f352b}</style><text x="40" y="65" font-size="34" font-weight="600" fill="#1C1C1C">Build agents into the delivery workflow</text><text x="40" y="105" font-size="18" fill="#5A5D5C">The output is a reviewable change with checks and verification.</text><path d="M 275 214 H 360 V 214 H 445" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#workflow-arrow)"/><path d="M 695 214 H 810 V 214 H 925" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#workflow-arrow)"/><path d="M 1037.5 258 V 354 H 1037.5 V 450" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#workflow-arrow)"/><path d="M 925 494 H 810 V 494 H 695" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#workflow-arrow)"/><rect x="740" y="469" width="140" height="21" fill="#F4F3EE"/><text x="810" y="484" text-anchor="middle" font-size="15" fill="#1C1C1C">ready for review</text><path d="M 445 494 H 360 V 494 H 275" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#workflow-arrow)"/><rect x="286" y="469" width="148" height="21" fill="#F4F3EE"/><text x="360" y="484" text-anchor="middle" font-size="15" fill="#1C1C1C">approved delivery</text><rect x="50" y="170" width="225" height="88" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="66" y="201" font-size="18.2" font-weight="600" fill="#1C1C1C">Request / incident</text><text x="66" y="227" font-size="13.5" fill="#1C1C1C">Issue + acceptance criteria</text><rect x="445" y="170" width="250" height="88" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="461" y="201" font-size="20" font-weight="600" fill="#1C1C1C">Plan + investigate</text><text x="461" y="227" font-size="15.8" fill="#1C1C1C">Scoped evidence and skills</text><rect x="925" y="170" width="225" height="88" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="941" y="201" font-size="20" font-weight="600" fill="#1C1C1C">Prepare change</text><text x="941" y="227" font-size="14" fill="#1C1C1C">Isolated branch / draft PR</text><rect x="50" y="450" width="225" height="88" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="66" y="481" font-size="20" font-weight="600" fill="#1C1C1C">Verify outcome</text><text x="66" y="507" font-size="12.6" fill="#1C1C1C">Health + telemetry + receipts</text><rect x="445" y="450" width="250" height="88" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><path d="M445 450 H695" stroke="#E60000" stroke-width="3"/><text x="461" y="481" font-size="20" font-weight="600" fill="#1C1C1C">Human decision</text><text x="461" y="507" font-size="16" fill="#1C1C1C">Approve exact PR / action</text><rect x="925" y="450" width="225" height="88" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="941" y="481" font-size="18.2" font-weight="600" fill="#1C1C1C">Independent checks</text><text x="941" y="507" font-size="16" fill="#1C1C1C">CI + review + evidence</text><path d="M40 634 H1160" stroke="#CCCABC"/><text x="40" y="660" font-size="14" fill="#5A5D5C">Workflow pattern; implementation varies</text><text x="1160" y="660" text-anchor="end" font-size="14" fill="#5A5D5C">11 / 14</text></svg>