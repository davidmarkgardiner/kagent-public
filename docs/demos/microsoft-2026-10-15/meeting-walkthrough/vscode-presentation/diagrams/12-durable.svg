<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="durable-title durable-desc"><title id="durable-title">An event starts a durable piece of work</title><desc id="durable-desc">The embedded classifier decides when to hand over. Substrate starts or resumes the work environment.</desc><rect width="1200" height="680" fill="#F4F3EE"/><defs><marker id="durable-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E60000"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}a:hover rect{stroke-width:3}a:focus{outline:3px solid #9f352b}</style><text x="40" y="65" font-size="34" font-weight="600" fill="#1C1C1C">An event starts a durable piece of work</text><text x="40" y="105" font-size="18" fill="#5A5D5C">The embedded classifier decides when to hand over. Substrate starts or resumes the work environment.</text><path d="M 290 220 H 365 V 220 H 440" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#durable-arrow)"/><path d="M 725 220 H 825 V 220 H 925" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#durable-arrow)"/><rect x="767" y="195" width="116" height="21" fill="#F4F3EE"/><text x="825" y="210" text-anchor="middle" font-size="15" fill="#1C1C1C">dispatch task</text><path d="M 582.5 275 V 368 H 165 V 460" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#durable-arrow)"/><rect x="340" y="345" width="68" height="21" fill="#F4F3EE"/><text x="373.75" y="360" text-anchor="middle" font-size="15" fill="#1C1C1C">no work</text><path d="M 1042.5 275 V 362 H 1042.5 V 450" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#durable-arrow)"/><path d="M 725 510 H 825 V 510 H 925" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#durable-arrow)"/><rect x="763" y="485" width="124" height="21" fill="#F4F3EE"/><text x="825" y="500" text-anchor="middle" font-size="15" fill="#1C1C1C">load / persist</text><rect x="40" y="165" width="250" height="110" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="56" y="196" font-size="20" font-weight="600" fill="#1C1C1C">Process signals</text><text x="56" y="222" font-size="16" fill="#1C1C1C">K8s events · logs</text><text x="56" y="246" font-size="16" fill="#1C1C1C">Trades · database changes</text><rect x="440" y="165" width="285" height="110" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="456" y="196" font-size="18.6" font-weight="600" fill="#1C1C1C">Embedded classification</text><text x="456" y="222" font-size="16" fill="#1C1C1C">Decide + classify + hand over</text><rect x="925" y="165" width="235" height="110" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="941" y="196" font-size="20" font-weight="600" fill="#1C1C1C">Substrate</text><text x="941" y="222" font-size="14.2" fill="#1C1C1C">Create / resume environment</text><rect x="40" y="460" width="250" height="100" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="56" y="491" font-size="20" font-weight="600" fill="#1C1C1C">Continue observing</text><text x="56" y="517" font-size="16" fill="#1C1C1C">No task needed</text><rect x="440" y="450" width="285" height="120" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="456" y="481" font-size="20" font-weight="600" fill="#1C1C1C">Task context</text><text x="456" y="507" font-size="16" fill="#1C1C1C">State + environment</text><text x="456" y="531" font-size="16" fill="#1C1C1C">Knowledge + workflow + goal</text><rect x="925" y="450" width="235" height="120" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><path d="M925 450 H1160" stroke="#E60000" stroke-width="3"/><text x="941" y="481" font-size="20" font-weight="600" fill="#1C1C1C">Durable agent</text><text x="941" y="507" font-size="14.7" fill="#1C1C1C">Investigate + prepare work</text><path d="M40 634 H1160" stroke="#CCCABC"/><text x="40" y="660" font-size="14" fill="#5A5D5C">PoC direction · broader ev