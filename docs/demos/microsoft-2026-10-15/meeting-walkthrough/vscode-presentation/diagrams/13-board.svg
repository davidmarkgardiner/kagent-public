<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="board-title board-desc"><title id="board-title">The human comes back to completed work</title><desc id="board-desc">One task stays visible across execution, pause/resume and the approval decision.</desc><rect width="1200" height="680" fill="#F4F3EE"/><defs><marker id="board-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E60000"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}a:hover rect{stroke-width:3}a:focus{outline:3px solid #9f352b}</style><text x="40" y="65" font-size="34" font-weight="600" fill="#1C1C1C">The human comes back to completed work</text><text x="40" y="105" font-size="18" fill="#5A5D5C">One task stays visible across execution, pause/resume and the approval decision.</text><path d="M 285 235 H 308 V 235 H 330" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#board-arrow)"/><path d="M 575 235 H 598 V 235 H 620" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#board-arrow)"/><path d="M 1060 505 L 1175 505 L 1175 355 L 1032 355 L 1032 295" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#board-arrow)"/><path d="M 452.5 295 V 372 H 452.5 V 450" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#board-arrow)"/><path d="M 742.5 295 V 372 H 890 V 450" fill="none" stroke="#E60000" stroke-width="2" marker-end="url(#board-arrow)"/><path d="M 720 505 V 390 H 452.5 V 295" fill="none" stroke="#E60000" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#board-arrow)"/><rect x="556" y="367" width="60" height="21" fill="#F4F3EE"/><text x="586.25" y="382" text-anchor="middle" font-size="15" fill="#1C1C1C">revise</text><rect x="40" y="175" width="245" height="120" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="56" y="206" font-size="20" font-weight="600" fill="#1C1C1C">Classified</text><text x="56" y="232" font-size="16" fill="#1C1C1C">Task + goal</text><text x="56" y="256" font-size="16" fill="#1C1C1C">Evidence attached</text><rect x="330" y="175" width="245" height="120" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="346" y="206" font-size="20" font-weight="600" fill="#1C1C1C">Working</text><text x="346" y="232" font-size="16" fill="#1C1C1C">Durable environment</text><text x="346" y="256" font-size="16" fill="#1C1C1C">Scoped tools + knowledge</text><rect x="620" y="175" width="245" height="120" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><path d="M620 175 H865" stroke="#E60000" stroke-width="3"/><text x="636" y="206" font-size="20" font-weight="600" fill="#1C1C1C">Ready for approval</text><text x="636" y="232" font-size="16" fill="#1C1C1C">PR / proposed action</text><text x="636" y="256" font-size="16" fill="#1C1C1C">Checks + evidence</text><rect x="910" y="175" width="245" height="120" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="926" y="206" font-size="20" font-weight="600" fill="#1C1C1C">Verified</text><text x="926" y="232" font-size="16" fill="#1C1C1C">Approved execution</text><text x="926" y="256" font-size="16" fill="#1C1C1C">Outcome receipt</text><rect x="330" y="450" width="245" height="110" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><text x="346" y="481" font-size="20" font-weight="600" fill="#1C1C1C">Persist / resume</text><text x="346" y="507" font-size="16" fill="#1C1C1C">Task + environment state</text><text x="346" y="531" font-size="16" fill="#1C1C1C">Continue the same work</text><rect x="720" y="450" width="340" height="110" fill="#FFFFFF" stroke="#CCCABC" stroke-width="1.5"/><path d="M720 450 H1060" stroke="#E60000" stroke-width="3"/><text x="736" y="481" font-size="20" font-weight="600" fill="#1C1C1C">Human approval</text><text x="736" y="507" font-size="16" fill="#1C1C1C">Approve exact PR / action</text><text x="736" y="531" font-size="16" fill="#1C1C1C">Or return it for revision</text><path d="M40 634 H1160" stroke="#CCCABC"/><text x="40" y="660" font-size="14" fill="#5A5D5C">Conceptual UI board · no live task state</text><text x="1160" y="660" text-anchor="end" font-size="14" fill="#5A5D5C">13 / 14</text></svg>