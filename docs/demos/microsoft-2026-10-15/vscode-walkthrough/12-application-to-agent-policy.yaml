# STEP 12 - Lock down which app can invoke which agent
# SAY: The calling application needs an Entra access token for this A2A API and its
#   assigned invoke role.
# POINT TO: Target route, Strict JWT issuer/audience/JWKS, exact caller azp/oid and
#   Require.
# BOUNDARY: JWT is the signed format of the Microsoft token, not a second token. All
#   Require expressions are mandatory.

# Validates the Microsoft Entra API access token, whose format is a signed JWT.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: application-to-sre-chat
  namespace: platform-gateway
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: sre-chat-a2a
  traffic:
    # 1. Validate the Entra-issued API access token using Microsoft signing keys.
    jwtAuthentication:
      mode: Strict
      providers:
      - issuer: https://login.microsoftonline.com/{{ENTRA_TENANT_ID}}/v2.0
        audiences:
        - '{{A2A_API_CLIENT_ID}}'
        jwks:
          remote:
            backendRef:
              name: entra-jwks
              kind: AgentgatewayBackend
              group: agentgateway.dev
              port: 443
            jwksPath: /{{ENTRA_TENANT_ID}}/discovery/v2.0/keys
    # 2. Require the exact approved identity and API role.
    authorization:
      action: Require
      policy:
        matchExpressions:
        - has(jwt.tid) && jwt.tid == "{{ENTRA_TENANT_ID}}"
        - has(jwt.azp) && jwt.azp == "{{CALLER_UAMI_CLIENT_ID}}"
        - has(jwt.oid) && jwt.oid == "{{CALLER_UAMI_PRINCIPAL_ID}}"
        - has(jwt.roles) && "sre.chat.invoke" in jwt.roles
